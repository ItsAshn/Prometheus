version: "3.8"

# PROMETHEUS DOCKER COMPOSE
# ==========================
# 
# UPDATING PROMETHEUS:
# - Method 1 (Recommended): bash scripts/update.sh
# - Method 2: docker-compose pull && docker-compose up -d --force-recreate
# - Method 3 (Auto-updates): docker-compose --profile auto-update up -d
#
# SECURITY NOTES:
# - Never commit .env files with real secrets to Git
# - Change default passwords before deploying
# - Use strong JWT secrets in production

services:
  prometheus:
    # Pull pre-built image from Docker Hub
    # Version info is baked into the image during CI/CD build
    image: ${IMAGE_NAME:-itsashn/prometheus}:${IMAGE_TAG:-latest}

    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persistent storage for uploaded videos and processed content
      - video-data:/app/public/videos
      - temp-data:/app/temp
      - app-data:/app/data
    environment:
      - NODE_ENV=production
      # Version info (APP_VERSION, BUILD_DATE, VCS_REF) is baked into the Docker image
      # at build time and should not be overridden here
      # Admin credentials will be auto-generated on first run if not provided
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme123}
      # JWT will be auto-generated securely on startup if not provided or insecure
      - JWT_SECRET=${JWT_SECRET:-}
      - DOCKER_CONTAINER=true
      - IMAGE_NAME=${IMAGE_NAME:-itsashn/prometheus}
    networks:
      cloudflareTunnel:
        ipv4_address: 172.18.0.7
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (optimized for video streaming)
    deploy:
      resources:
        limits:
          memory: 3G # Increased for video processing
          cpus: "2.0" # More CPU for FFmpeg encoding
        reservations:
          memory: 1G # Higher baseline for video handling
          cpus: "1.0"
    labels:
      - "com.prometheus.description=Self-hosted video streaming platform"
      # Version info is available via the API at /api/version

  # Watchtower: Automatic Docker Image Updates
  # Enable with: docker-compose --profile auto-update up -d
  # Disable with: docker-compose stop watchtower
  # ⚠️ SECURITY WARNING: Watchtower requires access to Docker socket, granting root-level access.
  #    Only use in trusted environments.
  watchtower:
    image: containrrr/watchtower
    container_name: prometheus-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # ⚠️ Root-level access to Docker daemon
    environment:
      - WATCHTOWER_CLEANUP=true # Remove old images after update
      - WATCHTOWER_POLL_INTERVAL=86400 # Check for updates daily (24 hours)
      - WATCHTOWER_INCLUDE_STOPPED=false # Only update running containers
      - WATCHTOWER_INCLUDE_RESTARTING=false # Skip containers that are restarting
    command: prometheus # Only monitor the prometheus container
    profiles:
      - auto-update # Only runs when explicitly enabled
    networks:
      - cloudflareTunnel

volumes:
  video-data:
    driver: local
  temp-data:
    driver: local
  app-data:
    driver: local

networks:
  cloudflareTunnel:
    external: true
